<style>
/* style.css */
:root{--bg:#f4f6f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e1e5ea;--ac:#2563eb;--g:#0f9d58;--r:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#98a2b3;--bd:#262c36;--ac:#5b9bff;--g:#34c27a;--r:#ff6b60}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#98a2b3;--bd:#262c36;--ac:#5b9bff;--g:#34c27a;--r:#ff6b60}
html,body{height:auto}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 12px 96px}
h1{font-size:22px;margin:4px 0}h2{font-size:18px;margin:18px 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;cursor:pointer}.fl{flex:1;min-width:0}
.th{width:54px;height:54px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.rt{text-align:right;font-weight:700;font-size:16px}.sm{font-size:12px;font-weight:400}.mut{color:var(--mut)}
.g{color:var(--g)}.r{color:var(--r)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--r);color:var(--r);border-radius:20px;padding:0 7px;margin:3px 4px 0 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;font-size:13px}.btn.d{background:var(--r)}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 0}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:3px}
textarea{min-height:70px;resize:vertical}input[type=checkbox]{width:auto;margin:0}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto}
.sh{background:var(--card);max-width:640px;margin:0 auto;min-height:100%;padding:14px 14px 40px}
.prev{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:10px;font-size:13px}
.ph .pv{aspect-ratio:16/10;background:var(--bg);border:1px dashed var(--bd);border-radius:8px;margin:3px 0 6px;overflow:hidden}
.ph .pv img{width:100%;height:100%;object-fit:contain}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
a.btn{text-decoration:none}#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;overflow:auto}.ph .pv img{cursor:zoom-in}nav button{flex:1 0 auto;white-space:nowrap}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}.cal i{text-align:center;font-style:normal}.cal button{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-size:13px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.cal button span{font-size:12px}.cal .cg{background:color-mix(in srgb,var(--g) 30%,var(--card))}.cal .cr{background:color-mix(in srgb,var(--r) 30%,var(--card))}nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:4px 5px;cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv .card{margin:0}.kv b{font-size:20px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
.ck{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;color:var(--tx)}
.warn{background:var(--bg);border:1px solid var(--r);border-radius:8px;padding:8px;font-size:13px}

@keyframes fx{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#app{animation:fx .25s ease}.sh{animation:up .25s ease}.card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn,.tile,.card.row,.chips2 button,.seg button,.bar{transition:transform .1s,background .15s}.btn:active,.tile:active,.card.row:active,.chips2 button:active{transform:scale(.96)}
nav{overflow:visible;justify-content:space-around}nav button{flex:1;font-size:12px;padding:4px 2px}nav button i{display:block;font-style:normal;font-size:22px;line-height:1.2}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:20;cursor:pointer}
#fabm{display:none;position:fixed;right:16px;bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:20;flex-direction:column;gap:8px;align-items:flex-end}
#fabm button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:10px 16px;font:inherit;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 24%,var(--card)),var(--card));border:1px solid var(--bd);border-radius:16px;padding:16px;margin:8px 0}.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:12px;margin:8px 6px 0 0}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px;margin:8px 0}.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 4px;border-radius:8px;cursor:pointer}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.chips2 button{flex:1;min-width:52px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px 6px;font:inherit;font-size:15px;cursor:pointer}.chips2 button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--card));font-weight:700}.chips2 button.on.g{border-color:var(--g);background:color-mix(in srgb,var(--g) 22%,var(--card))}.chips2 button.on.r{border-color:var(--r);background:color-mix(in srgb,var(--r) 22%,var(--card))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}.tile span{font-size:28px}.tile small{color:var(--mut)}
.rings{display:flex;justify-content:space-around;margin:12px 0}.ring{text-align:center;width:30%}.ring svg{width:100%;max-width:90px;color:var(--tx)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bar{flex:1;border:0;border-radius:3px 3px 0 0;min-height:4px;padding:0;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--ac)}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.dc{border:1px solid var(--bd);border-radius:8px;padding:4px 0;min-height:48px;color:var(--tx);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer}.dc b{font-size:12px}.tile span svg{color:var(--ac)}nav button i svg{display:block;margin:0 auto}
#splash{position:fixed;inset:0;z-index:999;background:#0e1116;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:spo .5s ease 1.1s forwards;pointer-events:none}#splash svg{width:96px;height:96px;animation:spi .6s ease}#splash b{color:#e8ebf0;font-size:22px;letter-spacing:.02em;font-family:system-ui,sans-serif}@keyframes spo{to{opacity:0;visibility:hidden}}@keyframes spi{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

/* análise ia */
.anx{white-space:pre-wrap;font-size:14px;margin:2px 0 6px}ul.anx{white-space:normal;padding-left:18px;margin:2px 0 6px}ul.anx li{margin:3px 0}
.vb{display:inline-block;border:1px solid currentColor;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700;vertical-align:middle;margin-left:6px}.vb.n{color:var(--mut)}.vb.w{color:#e8a317}
.anxm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.anxm div{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:12px;color:var(--mut)}.anxm b{display:block;font-size:14px;color:var(--tx)}
.anxb{height:8px;border-radius:8px;background:var(--bd);overflow:hidden;display:flex;margin-top:3px}.anxb i{display:block;height:8px}
.anxt{overflow-x:auto}.btn[disabled]{opacity:.6;cursor:progress}


/* Revisão 1 — seletores específicos para coexistir com os temas do app.js.
   Nenhuma tela do terminal ou tabela de mercado é reestruturada aqui. */
html:root body #app{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));line-height:1.55}
html:root body #app .hero2{background:linear-gradient(140deg,color-mix(in srgb,var(--ac) 12%,var(--card)),var(--card) 75%)!important;border:1px solid var(--bd)!important;box-shadow:0 8px 26px -20px #0005!important}
html:root body #app .hero2 .h2art{opacity:.12!important}
html:root body #app .hero2 .h2c{max-width:100%;isolation:isolate}
html:root body #app .hero2 .big{font-size:clamp(32px,4.5vw,48px)!important;line-height:1.2!important;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;text-shadow:none!important}
html:root body #app .hero2 .big:not(.g):not(.r){color:var(--tx)!important}
html:root body #app .hero2 .big.g{color:var(--g)!important}
html:root body #app .hero2 .big.r{color:var(--r)!important}
html:root body #app .hero2 .h2ks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}
html:root body #app .h2k{min-width:0;min-height:88px;padding:12px 14px!important;gap:4px;background:var(--card)!important}
html:root body #app .h2k b{font-size:22px!important;font-variant-numeric:tabular-nums}
html:root body #app .h2k small{font-size:12px!important;line-height:1.4;color:var(--mut)}
html:root body #app .card{padding:16px;margin-top:10px;margin-bottom:10px}
html:root body #app .tcard{padding:16px 18px!important}
html:root body #app .tcard .tc-pl{font-size:20px;line-height:1.3;font-variant-numeric:tabular-nums}
html:root body #app .tcard .mut{line-height:1.5}
html:root body #app .sm{font-size:13px;line-height:1.5}
html:root body #app h1{font-size:clamp(24px,3vw,30px);line-height:1.2;letter-spacing:-.025em}
html:root body #app h2{font-size:13px;line-height:1.4;letter-spacing:.05em;margin-top:26px}
html:root body #app .tiles{gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
html:root body #app .tile{padding:18px;min-width:0;min-height:116px;gap:6px;text-align:left}
html:root body #app .tile small{font-size:13px;line-height:1.5}
html:root body #app .g2,html:root body #app .g3{gap:12px}
html:root body #app .g2>*,html:root body #app .g3>*{min-width:0}
html:root body #app .seg>button{min-height:42px;padding:8px 14px}
html:root body #app .btn{min-height:44px}
html:root body #app label{font-size:13px;line-height:1.5}
html:root body :is(button,a,input,select,textarea,summary):focus-visible{outline:3px solid var(--ac)!important;outline-offset:3px}
html:root body input[type=checkbox],html:root body input[type=radio]{width:20px;height:20px;flex:0 0 20px;accent-color:var(--ac)}
html:root body #svs[data-save-state="error"]{color:var(--r)!important;border:1px solid currentColor;border-radius:12px;padding:10px 12px;background:var(--card)}
html:root body #svs[data-save-state="pending"]{color:var(--mut)!important}
html:root body #sh .sh{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
@media(min-width:1000px){
 html:root body #app{max-width:1440px!important;padding-left:28px!important;padding-right:28px!important}
 html:root body #app .hero2{padding:24px!important}
 html:root body #app .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
 html:root body #app .pccols{gap:20px}
}
@media(max-width:600px){
 html:root body #app{padding-left:14px!important;padding-right:14px!important}
 html:root body #app .hero2{padding:18px 14px!important}
 html:root body #app .h2k{padding:10px!important;min-height:84px}
 html:root body #app .hero2 .h2ks{gap:7px}
 html:root body #app .h2k b{font-size:20px!important}
 html:root body #app .h2k small{font-size:12px!important}
 html:root body #app .card{padding:14px}
 html:root body #app .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 html:root body #app .tile{min-height:132px;padding:14px}
 html:root body input:not([type=checkbox]):not([type=radio]):not([type=range]),html:root body select,html:root body textarea{font-size:16px!important;min-height:44px}
 html:root body #app .cal button{min-width:0;font-size:13px}
}
@media(max-width:380px){
 html:root body #app .g3{grid-template-columns:1fr}
 html:root body #app .tiles{grid-template-columns:1fr}
 html:root body #app .tile{min-height:100px}
}
@media(prefers-reduced-motion:reduce){
 html:root body #app,html:root body .sh{animation:none!important}
 html:root body :is(.btn,.tile,.card,.seg button,.chips2 button){transition:none!important}
 html:root body #splash{animation:none!important;opacity:0;visibility:hidden}
 html:root body{scroll-behavior:auto!important}
}

/* Navegação rápida do Diário Terminal. */
body.trmon .trquick-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 4px;border-bottom:1px solid #38322a;background:#0b0b0b;color:#eee;font:12px/1.4 ui-monospace,Consolas,monospace}
.trquick-chip,.trquick-filter{border:1px solid #494135;border-radius:8px;background:#171510;color:#eee;padding:6px 9px;min-height:32px;font:inherit;cursor:pointer}
.trquick-chip:hover,.trquick-chip.favorite{border-color:#a17617;color:#ffc44d}.trquick-label,.trquick-key{color:#a9a49a;font-size:11px}.trquick-key{margin-left:auto}
.trquick-dialog{width:min(680px,calc(100vw - 28px));max-height:min(720px,88dvh);padding:18px;border:1px solid #62502c;border-radius:16px;background:#111211;color:#eee;box-shadow:0 24px 80px #0008;font:14px/1.5 system-ui,sans-serif}
.trquick-dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
.trquick-head{display:flex;align-items:center;justify-content:space-between;gap:14px}.trquick-head h2{font-size:20px;color:#ffc44d;margin:0;text-transform:none;letter-spacing:0}.trquick-head button{padding:7px 12px;border:1px solid #555;border-radius:8px;background:#222;color:#eee;font:inherit;cursor:pointer}
html:root body .trquick-dialog .trquick-search{margin:16px 0 10px;background:#080a09!important;color:#fff!important;border:1px solid #746039!important;min-height:46px;font-size:16px!important;border-radius:8px;padding:11px 12px;width:100%}
.trquick-filters{display:flex;gap:7px;margin-bottom:10px}.trquick-filter[aria-pressed=true]{background:#ffbd38;color:#111;border-color:#ffbd38}
.trquick-results{max-height:420px;overflow-y:auto;overscroll-behavior:contain}.trquick-row{display:flex;border-bottom:1px solid #292b28;border-radius:8px}.trquick-row:has(.selected),.trquick-row:hover{background:#26241c}
.trquick-open{flex:1;min-width:0;display:grid;grid-template-columns:minmax(70px,125px) 1fr;gap:2px 14px;padding:11px;text-align:left;background:none;border:0;color:#eee;font:inherit;cursor:pointer}.trquick-open b{color:#ffcc65;font:700 13px ui-monospace,Consolas,monospace;overflow-wrap:anywhere;grid-row:span 2}.trquick-open span{overflow-wrap:anywhere}.trquick-open small{color:#aaa;font-size:11px}
.trquick-star{background:none;border:0;color:#ffd179;font-size:24px;width:44px;flex:0 0 44px;cursor:pointer}.trquick-hint,.trquick-empty{color:#aaa;font-size:12px;margin-bottom:0}.trquick-dialog :focus-visible{outline:2px solid #ffca56!important;outline-offset:2px}
@media(max-width:600px){.trquick-key{display:none}.trquick-dialog{padding:14px}.trquick-open{grid-template-columns:85px 1fr}.trquick-results{max-height:52dvh}.trquick-strip{gap:4px!important}.trquick-chip{min-height:36px}}

.trquick-announcement{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* v283 — calendário mensal e componentes compartilhados do diário. */
html:root body #app :is(.mc,.cal,.month-grid){display:grid!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;grid-auto-flow:row;gap:6px;width:100%;min-width:0;max-width:100%;overflow:visible;text-align:center;padding:4px 0 8px}
html:root body #app :is(.mc,.cal)>*{min-width:0;max-width:100%;overflow-wrap:anywhere}
html:root body #app :is(.mc,.cal)>button{width:100%;min-width:0;min-height:46px;height:auto;aspect-ratio:auto!important;padding:6px 2px;gap:3px;border-radius:12px;font-size:13px;line-height:1.25;justify-content:center}
html:root body #app :is(.mc,.cal)>button b{font-size:12px;font-variant-numeric:tabular-nums}
html:root body #app :is(.mc,.cal)>button[aria-current=date]{outline:2px solid var(--ac);outline-offset:-2px;font-weight:700}

html:root body :is(#app,#sh) .btn.d:not(.s){background:#b42335!important;color:#fff!important;-webkit-text-fill-color:#fff!important;border:1px solid #b42335!important;opacity:1;font-size:14px!important;font-weight:700;text-indent:0;line-height:1.4;min-height:44px;white-space:normal}

html:root body #app :is(.g2,.g3,.kv,.tiles)>*{min-width:0}
html:root body :is(#app,#sh) :is(input,select,textarea){max-width:100%;min-width:0}
