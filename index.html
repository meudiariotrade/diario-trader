<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0e1116"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Diário Trader"><title>Diário de Trader</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e1e5ea;--ac:#2563eb;--g:#0f9d58;--r:#d93025;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#98a2b3;--bd:#262c36;--ac:#5b9bff;--g:#34c27a;--r:#ff6b60}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--tx:#e8ebf0;--mut:#98a2b3;--bd:#262c36;--ac:#5b9bff;--g:#34c27a;--r:#ff6b60}
html,body{height:auto}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 12px 96px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:18px 0 8px}h3{font-size:14px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:10px;align-items:center;cursor:pointer}.fl{flex:1;min-width:0}
.th{width:54px;height:54px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:22px;flex:none}
.th img{width:100%;height:100%;object-fit:cover}
.rt{text-align:right;font-weight:700;font-size:16px}.sm{font-size:12px;font-weight:400}.mut{color:var(--mut)}
.g{color:var(--g)}.r{color:var(--r)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--r);color:var(--r);border-radius:20px;padding:0 7px;margin:3px 4px 0 0}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;font-size:13px}.btn.d{background:var(--r)}
.x{background:none;border:0;color:var(--mut);font-size:20px;cursor:pointer}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 0}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:3px}
textarea{min-height:70px;resize:vertical}input[type=checkbox]{width:auto;margin:0}
.g2,.g3{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto}
.sh{background:var(--card);max-width:640px;margin:0 auto;min-height:100%;padding:14px 14px 40px}
.prev{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:10px;font-size:13px}
.ph .pv{aspect-ratio:16/10;background:var(--bg);border:1px dashed var(--bd);border-radius:8px;margin:3px 0 6px;overflow:hidden}
.ph .pv img{width:100%;height:100%;object-fit:contain}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
a.btn{text-decoration:none}#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:100;overflow:auto}.ph .pv img{cursor:zoom-in}nav button{flex:1 0 auto;white-space:nowrap}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}.cal i{text-align:center;font-style:normal}.cal button{aspect-ratio:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:inherit;font-size:13px;padding:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}.cal button span{font-size:9px}.cal .cg{background:color-mix(in srgb,var(--g) 30%,var(--card))}.cal .cr{background:color-mix(in srgb,var(--r) 30%,var(--card))}nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;padding:4px 5px;cursor:pointer}nav button.on{color:var(--ac);font-weight:700}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv .card{margin:0}.kv b{font-size:20px;display:block}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
.ck{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px;color:var(--tx)}
.warn{background:var(--bg);border:1px solid var(--r);border-radius:8px;padding:8px;font-size:13px}

@keyframes fx{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#app{animation:fx .25s ease}.sh{animation:up .25s ease}.card{box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn,.tile,.card.row,.chips2 button,.seg button,.bar{transition:transform .1s,background .15s}.btn:active,.tile:active,.card.row:active,.chips2 button:active{transform:scale(.96)}
nav{overflow:visible;justify-content:space-around}nav button{flex:1;font-size:11px;padding:4px 2px}nav button i{display:block;font-style:normal;font-size:21px;line-height:1.2}
#fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:20;cursor:pointer}
#fabm{display:none;position:fixed;right:16px;bottom:calc(144px + env(safe-area-inset-bottom,0px));z-index:20;flex-direction:column;gap:8px;align-items:flex-end}
#fabm button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:24px;padding:10px 16px;font:inherit;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 24%,var(--card)),var(--card));border:1px solid var(--bd);border-radius:18px;padding:16px;margin:8px 0}.hero .big{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:3px 10px;font-size:12px;margin:8px 6px 0 0}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px;margin:8px 0}.seg button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 4px;border-radius:9px;cursor:pointer}.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}.chips2 button{flex:1;min-width:52px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px 6px;font:inherit;font-size:15px;cursor:pointer}.chips2 button.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,var(--card));font-weight:700}.chips2 button.on.g{border-color:var(--g);background:color-mix(in srgb,var(--g) 22%,var(--card))}.chips2 button.on.r{border-color:var(--r);background:color-mix(in srgb,var(--r) 22%,var(--card))}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px}.tile span{font-size:26px}.tile small{color:var(--mut)}
.rings{display:flex;justify-content:space-around;margin:12px 0}.ring{text-align:center;width:30%}.ring svg{width:100%;max-width:90px;color:var(--tx)}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px}.bar{flex:1;border:0;border-radius:3px 3px 0 0;min-height:4px;padding:0;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--ac)}
</style></head><body>
<div id="app"></div><div id="sh"></div><div id="lb"></div>
<nav><button data-tab="home"><i>🏠</i>Início</button><button data-tab="trades"><i>📸</i>Trades</button><button data-tab="dia"><i>📝</i>Dia</button><button data-tab="stats"><i>📊</i>Stats</button><button data-tab="mais"><i>⋯</i>Mais</button></nav><button id="fab" data-a="fab" aria-label="Novo trade">＋</button><div id="fabm"><button data-a="new" data-tp="D">📸 Day trade</button><button data-a="new" data-tp="S">🌊 Swing</button><button data-a="new" data-tp="O">🎯 Opção</button></div>
<script>window.CLOUD_OK=1</script><script src="config.js"></script>
<script>
const MK=['Alta calma','Alta volátil','Lateral calma','Lateral volátil','Baixa calma','Baixa volátil'];
const ERR=['Nenhum','Entrei por dica/emoção (fora do sistema)','Não saí no stop','Risco grande demais','Saí cedo por emoção','Não segui minha rotina','Operei fora do tipo de mercado','Foquei na entrada, não no risco/retorno','Entrei sem saída predeterminada','Precisava estar certo (realizei cedo/segurei perda)','Operei demais (perdi o controle)','Outro'];
const ESTR=['Compra de call','Compra de put','Venda coberta de call','Venda de put','Trava de alta','Trava de baixa','Financiamento / collar','Straddle / strangle','Borboleta / condor','Calendário','Outra'];
const CATS=['Plano de trade','Gestão de risco','Rotina','Psicologia'];
const SEED=[[0,'Só entro com setup do meu sistema (nunca por dica ou emoção)'],[0,'Defino a saída predeterminada antes de entrar'],[0,'Só opero o tipo de mercado para o qual meu sistema foi feito'],[1,'Defino o stop inicial (1R) antes de entrar'],[1,'Risco máximo de 1% do capital por trade'],[1,'Só pego trade com potencial de pelo menos 3R'],[1,'Saio quando o stop é atingido'],[2,'Faço autoavaliação e ensaio mental antes de abrir o mercado'],[2,'Registro todo trade com seu R-múltiplo'],[2,'Faço o debriefing no fim do dia'],[3,'Assumo a responsabilidade pelo resultado, sem culpar o mercado'],[3,'Aceito a perda no stop: não preciso estar certo']];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10),sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>n==null||!isFinite(n)?'–':n.toFixed(2).replace('.',','),fr=r=>(r>0?'+':'')+f2(r)+'R',pc=x=>Math.round(x*100)+'%',cls=n=>n>0?'g':n<0?'r':'';
const money=n=>n==null?'–':n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const opt=(a,v)=>a.map(x=>{const[k,l]=Array.isArray(x)?x:[x,x];return `<option value="${esc(k)}"${k==v?' selected':''}>${esc(l)}</option>`}).join('');
const loc=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString()};
const fdt=s=>s.slice(8,10)+'/'+s.slice(5,7)+' '+s.slice(11,16);
let S={trades:[],days:{},rules:[],seed:0},tab='home',T=null,orig={},isNew=0,delArm=0,D=loc().slice(0,10),db=null,M={},U={},st,PER='all',AUTO=0,TIPO='all',OPEN={},QM=0,VW={},LT='trades',SV=0,DV='ed',DX=null,LF={f:'all',q:''},CH={},SESS=null,AM='in',RECOV=null,SY={msg:'',email:''},sT;
const inPer=dt=>{if(PER==='all')return 1;const d=dt.slice(0,10),t=loc().slice(0,10);if(PER==='hoje')return d===t;if(PER==='mes')return d.slice(0,7)===t.slice(0,7);const c=new Date(Date.now()-(PER==='7'?7:30)*864e5);return d>=new Date(c-c.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const tipoSel=()=>`<label>Tipo<select id="tp">${opt([['all','Todos'],['D','Só day trade'],['S','Só swing'],['O','Só opções']],TIPO)}</select></label>`;
const sym=s=>{s=s.trim().toUpperCase();return s.includes(':')?s:'BMFBOVESPA:'+s};
const perSel=()=>`<label>Período<select id="per">${opt([['all','Tudo'],['hoje','Hoje'],['7','Últimos 7 dias'],['30','Últimos 30 dias'],['mes','Este mês']],PER)}</select></label>`;
const open=()=>new Promise(r=>{try{const q=indexedDB.open('diario-trader',1);q.onupgradeneeded=()=>{q.result.createObjectStore('kv');q.result.createObjectStore('img')};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const idb=(s,m,...a)=>new Promise(r=>{if(!db)return r();try{const q=db.transaction(s,m==='get'?'readonly':'readwrite').objectStore(s)[m](...a);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const persist=()=>{clearTimeout(st);st=setTimeout(()=>idb('kv','put',S,'s'),250)},save=()=>{S.mt=Date.now();SV=Date.now();persist();syncSoon();svUi()};
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.7)};i.onerror=()=>r(null);i.src=URL.createObjectURL(f)});
async function fillImgs(){for(const e of document.querySelectorAll('img[data-img]')){const id=e.dataset.img;if(!U[id]){const b=M[id]||await idb('img','get',id);if(b)U[id]=URL.createObjectURL(b)}if(U[id])e.src=U[id]}}
const isOpen=t=>!(t.exit!==''&&t.exit!=null&&isFinite(+t.exit));
function calc(t){const d=t.side==='C'?1:-1,pv=+t.pv||1,q=+t.qty||0,e=+t.entry,s=+t.stop,x=+t.exit,has=t.exit!==''&&t.exit!=null&&isFinite(x),risk=Math.abs(e-s)*q*pv,pl=has?(x-e)*d*q*pv-(+t.cost||0):null,r=has&&risk>0?pl/risk:null,rr=t.target!==''&&t.target!=null&&e!==s&&isFinite(+t.target)?Math.abs(+t.target-e)/Math.abs(e-s):null;return{risk,pl,r,rr}}
/* ---------- Trades ---------- */
function card(t){const c=calc(t),p=t.pplan||t.pin||t.pout;return `<div class="card row" data-a="edit" data-id="${t.id}" data-s="${esc(((t.ativo||'')+' '+(t.setup||'')).toLowerCase())}"><div class="th">${p?`<img data-img="${p}">`:'📈'}</div><div class="fl"><b>${esc(t.ativo)||'—'}</b> · ${t.tipo==='O'?(t.side==='C'?'Comprado':'Lançado'):(t.side==='C'?'Compra':'Venda')}<div class="mut sm">${fdt(t.dt)}${t.tipo==='O'&&t.strike?' · '+(t.ot==='P'?'Put':'Call')+' '+esc(t.strike):''}${t.setup?' · '+esc(t.setup):''}</div>${t.err&&t.err!=='Nenhum'?'<span class="tag">⚠ erro</span>':''}${t.rules==='n'?'<span class="tag">fora das regras</span>':''}</div><div class="rt ${cls(c.r)}">${c.r==null?'<span class="mut sm">aberto</span><br><button class="btn s" data-a="enc" data-id="${t.id}" style="margin-top:4px">Encerrar</button>':fr(c.r)}<div class="sm mut">${c.pl==null?'':money(c.pl)}</div></div></div>`}
function vList(tp='D'){const sw=tp==='S',ts=S.trades.filter(t=>(t.tipo||'D')===tp&&inPer(t.dt)).sort((a,b)=>b.dt.localeCompare(a.dt));const cr=ts.map(t=>calc(t).r).filter(x=>x!=null);return `<div class="top"><h1>${{D:'Day trade',S:'Swing trade',O:'Opções'}[tp]}</h1><button class="btn" data-a="new" data-tp="${tp}">+ Novo trade</button></div>${perSel()}${filtBar()}${cr.length?`<div class="mut sm" style="margin-top:8px">${cr.length} fechado(s) · ${ts.length-cr.length} aberto(s) · expectância <b class="${cls(avg(cr))}">${fr(avg(cr))}</b></div>`:''}`+(ts.length?(fl(ts).map(card).join('')||'<p class="mut">Nada com esse filtro.</p>'):`<p class="mut">Nenhum trade ainda. ${tp==='O'?'Registre a opção com strike, vencimento e prêmios. O stop em prêmio define 1R.':sw?'Envie a foto do planejamento (entrada, stop e alvos), o stop inicial define 1R.':'Registre o primeiro, com as fotos de entrada e saída, o stop inicial (1R) e o resultado.'}</p>`)}
function sheet(){const t=T,slot=(k,l)=>`<div class="ph"><label>${l}</label><div class="pv">${t[k]?`<img data-img="${t[k]}">`:''}</div><label class="btn s" style="color:var(--tx)">${t[k]?'Trocar':'Adicionar'} foto<input type="file" accept="image/*" hidden data-k="${k}"></label></div>`,n=(k,l,ph='')=>`<label>${l}<input name="${k}" type="number" step="any" inputmode="decimal" value="${esc(t[k])}" placeholder="${ph}"></label>`;
return `<div class="ov"><div class="sh"><div class="top"><h2 style="margin:0">${isNew?'Novo trade':'Editar trade'}${t.tipo==='S'?' (swing)':t.tipo==='O'?' (opção)':''}</h2><button class="x" data-a="close">✕</button></div>
<label>Data e hora<input type="datetime-local" name="dt" value="${t.dt}"></label>
<div class="g2"><label>Ativo<input name="ativo" value="${esc(t.ativo)}" placeholder="WINZ26"></label><div><label>Lado</label>${segs('side',t.side,t.tipo==='O'?[['C','Comprado','g'],['V','Lançado','r']]:[['C','Compra','g'],['V','Venda','r']])}</div></div>
<label>Setup / estratégia<input name="setup" value="${esc(t.setup)}"></label>
<label>Tipo de mercado<select name="mkt">${opt(MK,t.mkt)}</select></label>
${t.tipo==='O'?`<div class="g2"><label>Subjacente<input name="sub" value="${esc(t.sub)}" placeholder="PETR4"></label><label>Call / Put<select name="ot">${opt([['C','Call'],['P','Put']],t.ot||'C')}</select></label></div><div class="g2">${n('strike','Strike')}<label>Vencimento<input type="date" name="venc" value="${esc(t.venc)}"></label></div><div class="g2">${n('spot','Subjacente na entrada')}<label>Estrutura<select name="estr">${opt(ESTR,t.estr)}</select></label></div><div class="mut sm">Em travas e estruturas, use o prêmio líquido: débito = Comprado, crédito = Lançado.</div>`:''}
<div class="g3">${n('entry',t.tipo==='O'?'Prêmio de entrada':'Entrada')}${n('stop',t.tipo==='O'?'Prêmio do stop':'Stop inicial')}${n('target',t.tipo==='O'?'Prêmio alvo 1':t.tipo==='S'?'Alvo 1':'Alvo')}</div>
${t.tipo==='S'||t.tipo==='O'?`<div class="g2">${n('target2','Alvo 2')}${n('target3','Alvo 3')}</div>`:''}<div class="g3">${n('exit',t.tipo==='O'?'Prêmio de saída':'Saída')}${n('qty',t.tipo==='O'?'Qtd. de opções (lote 100)':'Qtd.')}${n('pv',t.tipo==='O'?'Multiplicador (1)':'R$/ponto')}</div>
${n('cost','Custos totais (R$)')}<label>Data e hora da saída<input type="datetime-local" name="dtx" value="${esc(t.dtx)}"></label>
<div class="prev" id="prev"></div>
<h3>Fotos</h3><div class="g2">${t.tipo==='S'||t.tipo==='O'?slot('pplan','Planejamento (entrada, stop, alvos)'):''}${slot('pin','Entrada')}${slot('pout','Saída')}</div>
<h3>Disciplina</h3>
<label>Segui minhas regras?</label>${segs('rules',t.rules,[['s','Sim','g'],['n','Não','r']])}<label>Como eu estava antes de entrar?</label><div class="chips2">${EMO.map((e,i)=>`<button class="${t.emo==i+1?'on':''}" data-seg="emo" data-v="${i+1}">${e}</button>`).join('')}</div>
<label>Erro cometido (erro = não seguir suas regras)<select name="err">${opt(ERR,t.err)}</select></label>
<label>Anotações (por que entrei, o que senti, o que aprendi)<textarea name="nota">${esc(t.nota)}</textarea></label>
<div id="msg" class="r" style="margin:8px 0"></div>
<div class="g2"><button class="btn" data-a="savetrade">Salvar</button>${isNew?'':`<button class="btn d" data-a="deltrade">${delArm?'Confirmar exclusão':'Excluir'}</button>`}</div></div></div>`}
