name: Gerar bundles (temporário)
on:
  push:
    branches: [bundle/v577]
permissions:
  contents: write
jobs:
  bundle:
    if: "!contains(github.event.head_commit.message, '[bundles]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run bundle
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "bundles v577 [bundles]" || echo "nada"
          git push
