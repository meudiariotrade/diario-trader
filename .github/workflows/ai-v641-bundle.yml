name: Gerar bundles v641 (temporario)
on:
  push:
    branches: [ai-build-v641]
    paths:
      - '.github/workflows/ai-v641-bundle.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar v641
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='release.config.json',cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          if(cfg.version!==640)throw Error('Versao inesperada: '+cfg.version);
          cfg.version=641;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - run: npm run bundle
      - run: npm run build:check
      - name: Commit somente de versao e bundles
        run: |
          git config user.name "Diario Trader Bundle Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --name-only
          git diff --cached --quiet && exit 1
          git commit -m "Publicação v641: incremento de versão e bundles gerados pelo script oficial"
          git push origin HEAD:ai-build-v641
