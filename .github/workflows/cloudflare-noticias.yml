name: Publicar Cloudflare Noticias e EWZ
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/diario-noticias/producao-snapshot-v894.mjs'
      - 'cloudflare/diario-noticias/pesquisa-v999.mjs'
      - 'supabase/functions/pesquisa/**'
      - 'supabase/functions/_shared/ai-router.ts'
      - 'tests/pesquisa-cloudflare-v999.test.cjs'
      - 'tests/pesquisa-ia-v1000.test.cjs'
      - 'cloudflare/diario-noticias/finnhub-v940.mjs'
      - 'cloudflare/diario-noticias/cotacoes-v954.mjs'
      - 'tests/cotacoes-v954.test.cjs'
      - 'cloudflare/diario-noticias/index.mjs'
      - 'cloudflare/diario-noticias/dados-publicos.mjs'
      - 'cloudflare/diario-noticias/sentimento-v964.mjs'
      - 'tests/cloudflare-dados-publicos-v811.test.cjs'
      - 'tests/cloudflare-finnhub-v940.test.cjs'
      - 'cloudflare/diario-noticias/wrangler.jsonc'
      - '.github/workflows/cloudflare-noticias.yml'
  pull_request:
    paths:
      - 'cloudflare/diario-noticias/**'
      - 'supabase/functions/notificar/noticias-urgentes.ts'
      - 'tests/cloudflare-finnhub-v940.test.cjs'
      - '.github/workflows/cloudflare-noticias.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-cloudflare-noticias
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/diario-noticias/producao-snapshot-v894.mjs
      - run: node --check cloudflare/diario-noticias/finnhub-v940.mjs
      - run: node --check cloudflare/diario-noticias/cotacoes-v954.mjs
      - run: node --test tests/pesquisa.test.cjs tests/livermore-eua-v998.test.cjs tests/pesquisa-cloudflare-v999.test.cjs tests/pesquisa-ia-v1000.test.cjs
      - run: node --test tests/cotacoes-v954.test.cjs tests/fef2-v1029.test.cjs tests/cotacoes-auto-v1030.test.cjs
      - run: node --test tests/cloudflare-finnhub-v940.test.cjs
      - run: node --test tests/cloudflare-noticias.test.cjs tests/cloudflare-dados-publicos-v811.test.cjs
      - name: Validar bundle Wrangler com o módulo Finnhub
        run: npx --yes wrangler@4.166.0 deploy --dry-run --config cloudflare/diario-noticias/wrangler.jsonc
      - name: Bloquear redirect incompatível no Worker
        run: |
          if grep -q 'redirect:"error"' cloudflare/diario-noticias/producao-snapshot-v894.mjs; then
            echo "::error::Worker contém redirect incompatível"
            exit 1
          fi
  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos sem exibir valores
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diario-noticias
          wranglerVersion: '4.166.0'
          command: deploy --config wrangler.jsonc
      - name: Validar rota Pesquisa em produção sem sessão
        run: |
          node -e "(async()=>{const base='https://diario-trader.lucianosilva43567.workers.dev/v1/pesquisa';const r=await fetch(base+'/health');const j=await r.json();if(!r.ok||j.ok!==true||j.servico!=='pesquisa-cloudflare'||j.contrato!==1)throw Error('health da pesquisa indisponível');const p=await fetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});if(p.status!==401||!p.headers.get('cache-control')?.includes('no-store'))throw Error('proteção da rota inválida');console.log('Pesquisa Cloudflare publicada e protegida')})().catch(e=>{console.error(e.message);process.exitCode=1})"
