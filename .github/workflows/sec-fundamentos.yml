name: Fundamentos SEC (EUA)
on:
  push:
    branches: [main]
    paths:
      - scripts/sec-fundamentos.cjs
      - .github/workflows/sec-fundamentos.yml
  schedule:
    - cron: '40 6 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sec-fundamentos
  cancel-in-progress: false
jobs:
  fundamentos:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extrair fundamentos anuais do SEC EDGAR XBRL, sem Supabase
        run: node scripts/sec-fundamentos.cjs
      - name: Versionar somente dados públicos
        shell: bash
        run: |
          git add dados-publicos/sec-fundamentos.json
          if git diff --cached --quiet; then
            echo "Sem mudanças"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dados(SEC): fundamentos anuais e Total Yield dos EUA sem dados privados"
          git pull --rebase origin main
          git push origin HEAD:main
