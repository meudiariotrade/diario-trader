name: Validacao v960
on:
  pull_request:
    branches: ['release/v960-tour-checklist']
permissions:
  contents: read
jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7831eea9b2b35b16ef910b7855dc3b6405ce7b8e
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build && npm run check
      - run: node --test tests/cripto-periodo-mobile-v960.test.cjs
