name: Publicar Cloudflare Radar (v892)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/diario-radar/**'
      - 'supabase/functions/notificar/**'
      - 'supabase/functions/rotina-cron/**'
      - 'tests/cloudflare-webpush-v1062.test.cjs'
      - 'tests/cloudflare-funcoes-locais-v1062.test.cjs'
      - '.github/workflows/cloudflare-radar.yml'
      - 'tests/cloudflare-agenda-preflight-v933.test.cjs'
      - 'tests/cloudflare-cron-cutover-v935.test.cjs'
  pull_request:
    paths:
      - 'tests/cloudflare-cron-cutover-v935.test.cjs'
      - 'cloudflare/diario-radar/**'
      - 'supabase/functions/notificar/**'
      - 'supabase/functions/rotina-cron/**'
      - 'tests/cloudflare-webpush-v1062.test.cjs'
      - 'tests/cloudflare-funcoes-locais-v1062.test.cjs'
      - 'tests/cloudflare-agenda-preflight-v933.test.cjs'
      - '.github/workflows/cloudflare-radar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare-radar
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/diario-radar/producao-v892.mjs
      - run: node --check cloudflare/diario-radar/agenda-v932.mjs
      - run: node --check cloudflare/diario-radar/agenda-preflight-v933.mjs
      - run: node --check cloudflare/diario-radar/agenda-health-v937.mjs
      - run: node --check cloudflare/diario-radar/segredos-v1041.mjs
      - run: node --check cloudflare/diario-radar/webpush-v1062.mjs
      - run: node --check cloudflare/diario-radar/funcoes-locais-v1062.mjs
      - run: node --test tests/cloudflare-radar-v892.test.cjs tests/cloudflare-agenda-v932.test.cjs tests/cloudflare-agenda-preflight-v933.test.cjs tests/cloudflare-cron-cutover-v935.test.cjs tests/cloudflare-agenda-health-v937.test.cjs tests/cloudflare-segredos-v1041.test.cjs tests/cloudflare-webpush-v1062.test.cjs tests/cloudflare-funcoes-locais-v1062.test.cjs
      - name: Empacotar (dry-run) com as rotinas do Supabase e o supabase-js
        working-directory: cloudflare/diario-radar
        run: npm ci --no-audit --no-fund && npx --yes wrangler@4.166.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/radar-dry
  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - name: Verificar segredos de publicacao (sem exibir valores)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN no GitHub"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID no GitHub"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Instalar dependências do Worker (supabase-js)
        working-directory: cloudflare/diario-radar
        run: npm ci --no-audit --no-fund
      - name: Publicar somente diario-radar, preservando os bindings
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diario-radar
          wranglerVersion: '4.166.0'
          command: deploy --config wrangler.jsonc
      - name: Confirmar bindings e crons publicados pelo Wrangler
        run: |
          echo "Worker Radar publicado; confirme a equivalencia dos agendamentos no D1 e o estado do pg_cron."
