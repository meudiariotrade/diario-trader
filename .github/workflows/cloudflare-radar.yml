name: Publicar Cloudflare Radar (v892)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/diario-radar/**'
      - '.github/workflows/cloudflare-radar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-cloudflare-radar
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/diario-radar/producao-v892.mjs
      - run: node --test tests/cloudflare-radar-v892.test.cjs
  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - id: credentials
        name: Verificar se GitHub tem acesso a Cloudflare (sem exibir valores)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "disponivel=true" >> "$GITHUB_OUTPUT"
          else
            echo "disponivel=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Credenciais de CI ausentes; Worker foi publicado pela conexao direta da Cloudflare. Deploy GitHub ignorado."
          fi
      - name: Publicar somente diario-radar, preservando os bindings
        if: steps.credentials.outputs.disponivel == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diario-radar
          command: deploy
      - name: Confirmar bindings e crons publicados pelo Wrangler
        run: |
          echo "Radar v892 implantado; modo de corte: desativado ate validacao de service role, Gemini e VAPID."
