name: Preparar e testar notícias urgentes v649
on:
  push:
    branches: ['feature/noticias-urgentes-v649']
permissions:
  contents: write
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run bundle
      - name: Testar monitor de notícias isoladamente
        run: node --test tests/noticias-urgentes.test.cjs
      - name: Validar scripts e regressões
        run: npm run verify
      - name: Compilar e sincronizar publicação
        run: npm run build
      - name: Salvar bundles e número de versão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Build: sincronizar bundles e manifestos v649 [skip ci]"
            git push origin HEAD:feature/noticias-urgentes-v649
          fi
