name: Estudos Economia v659 - validar, bundles e publicar
on:
  push:
    branches: [main]
    paths:
      - 'release.config.json'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: estudos-eco-v659
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar navegador
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Gerar bundles e incrementar versão
        run: npm run bundle
      - name: Conferir fontes, backend intacto e testes
        run: npm run verify
      - name: Empacotar
        run: npm run build
      - name: Sincronizar arquivos compilados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Build: sincronizar bundles v659 [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publicar:
    runs-on: ubuntu-24.04
    needs: validar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
