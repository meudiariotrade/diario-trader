name: Gerar bundles da calculadora v642 (temporário)
on:
  push:
    branches: [ai-risk-trade-v642]
    paths:
      - '.github/workflows/ai-risk-v642-bundle.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Incrementar versão sem alterar outras configurações
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='release.config.json', cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          if(cfg.version!==641)throw Error('Versão inesperada: '+cfg.version);
          cfg.version=642;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - run: npm run bundle
      - run: npm run build:check
      - run: node --check src/navigation/organizacao.js
      - name: Commit de versão e artefatos gerados
        run: |
          git config user.name "Diário Trader Bundle Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --name-only
          git diff --cached --quiet && exit 1
          git commit -m "v642: sincronizar versão e bundles da calculadora de posição em Operações"
          git push origin HEAD:ai-risk-trade-v642
