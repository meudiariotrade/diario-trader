name: Publicar Cloudflare Técnico (manual)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/diario-screeners/**'
      - 'tests/v904-aurea-panorama.test.cjs'
      - 'tests/aurea-jwks.test.cjs'
      - 'tests/v930-reserva-ia-cloudflare.test.cjs'
      - '.github/workflows/cloudflare-tecnico.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/diario-screeners/**'
      - 'tests/v930-reserva-ia-cloudflare.test.cjs'
      - '.github/workflows/cloudflare-tecnico.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publicar-cloudflare-tecnico
  cancel-in-progress: false
jobs:
  validar-reserva:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/diario-screeners/aurea-resumao-v904.mjs
      - run: node --test tests/aurea-imagem-v1004.test.cjs
      - run: node --test tests/cloudflare-screeners-v896.test.cjs
      - run: node --test tests/v904-aurea-panorama.test.cjs tests/aurea-jwks.test.cjs tests/v930-reserva-ia-cloudflare.test.cjs
  publicar-worker:
    needs: [validar-reserva]
    # Jamais implantar automaticamente a partir de Pull Request ou branch de experimento.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar contrato e ausência de fallback para Supabase
        run: node --test tests/cloudflare-screeners-v896.test.cjs tests/v904-aurea-panorama.test.cjs tests/aurea-jwks.test.cjs tests/v930-reserva-ia-cloudflare.test.cjs
      - name: Verificar pré-requisitos de publicação
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN não configurado"; exit 1; }
          test -n "$CF_ACCOUNT" || { echo "::error::Secret CLOUDFLARE_ACCOUNT_ID não configurado"; exit 1; }
          node --check cloudflare/diario-screeners/index.mjs
      - name: Publicar apenas o Worker diario-screeners-quant
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diario-screeners
          # Wrangler 3.90.0 não reconhece wrangler.jsonc; v4 preserva o contrato e a KV.
          wranglerVersion: '4.166.0'
          command: deploy --config wrangler.jsonc
      - name: Conferir BTC, B3, EUA, 15M e 1D no endpoint público
        run: node scripts/verify-tecnico-edge.cjs
