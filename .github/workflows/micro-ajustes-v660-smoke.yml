name: Microajustes v660 - teste isolado
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/micro-ajustes-v660-smoke.yml'
      - 'tests/mercado-compartilhamento-micro-v660.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Instalar navegador de teste
        run: |
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Gerar bundles de teste a partir das fontes
        run: npm run bundle
      - name: Testar os 4 microajustes e funções existentes
        run: node --test tests/mercado-compartilhamento-micro-v660.test.cjs tests/share-cards.test.cjs tests/share-cards-modelo.test.cjs tests/mercado-estabilidade.test.cjs tests/mercado-finnhub-dinamico.test.cjs
