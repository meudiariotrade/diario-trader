name: Gerar bundles notícias v645 (temporário)
on:
  push:
    branches: [ai-news-rss-reliability-v645]
    paths:
      - '.github/workflows/ai-news-v645-bundle.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Incrementar versão para v645
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='release.config.json',c=JSON.parse(fs.readFileSync(p,'utf8'));
          if(c.version!==644)throw Error('Versão inesperada '+c.version);
          c.version=645;
          fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
      - run: npm run bundle
      - run: npm run build:check
      - run: node --check src/domains/core/04-analises-e-estudos.js
      - name: Commit de versão e bundles
        run: |
          git config user.name "Diário Trader Bundle Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --name-only
          git diff --cached --quiet && exit 1
          git commit -m "v645: regenerar bundles e atualizar manifest e cache das notícias"
          git push origin HEAD:ai-news-rss-reliability-v645
