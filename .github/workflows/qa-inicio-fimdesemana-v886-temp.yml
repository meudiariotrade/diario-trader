name: QA temporario v886 Inicio e Fim de Semana
on:
  push:
    branches: [qa/inicio-fimdesemana-v886]
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, 'CI: bundles v886')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar navegador de testes
        run: |
          diario_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$diario_browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$diario_browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Build e geracao de bundles
        run: npm run build
      - name: Check e verificacao de bundles
        run: npm run check
      - name: Testes completos de regressao
        run: npm test
      - name: Salvar bundles produzidos para commit unico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "CI: bundles v886 [skip ci]"
            git push origin HEAD:refs/heads/qa/inicio-fimdesemana-v886
          fi
