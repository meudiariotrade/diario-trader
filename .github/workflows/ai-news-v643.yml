name: Gerar e validar notícias v643 (temporário)
on:
  push:
    branches: [ai-news-v643]
    paths:
      - '.github/workflows/ai-news-v643.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Testes isolados do serviço de Notícias
        run: |
          node --check src/domains/core/04-analises-e-estudos.js
          node --check src/domains/core/13-diagnostico-e-relatorios.js
          node --check src/domains/layers/02-carteira-e-terminal.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('node:assert/strict');
          const {JSDOM}=require('jsdom');
          const source=fs.readFileSync('src/domains/core/04-analises-e-estudos.js','utf8');
          const a=source.indexOf('const MK_FONTES_RSS =');
          const b=source.indexOf('async function mkLoad(force)',a);
          assert(a>=0&&b>a);
          const scope={DOMParser:new JSDOM('').window.DOMParser, URL, Date, Set, Map, fetch:()=>{throw Error('Sem rede no teste')}, AbortSignal, 
            mkNorm:s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')};
          const lib=vm.runInNewContext(source.slice(a,b)+';({mkLimpaTitulo,mkNoticia,mkDedup,mkRssXml})',scope);
          assert.equal(lib.mkLimpaTitulo('Bolsas avançam (Reuters)'),'Bolsas avançam');
          const now=new Date().toISOString();
          const n=(t,l,a='CNBC')=>lib.mkNoticia({t,l,d:now,a,c:[]});
          const one=n('Fed mantém juros diante de dados de inflação','https://example.com/um');
          const dup=n('Fed mantém juros diante de dados de inflação (Reuters)','https://example.com/dois');
          const other=n('Bitcoin sobe com demanda de fundos de investimento','https://example.com/tres');
          assert.equal(lib.mkDedup([one,dup,other]).length,2);
          assert.equal(other.c.includes('cripto'),true);
          assert.equal(lib.mkDedup([other,one])[0].t!==undefined,true);
          const xml='<rss><channel><item><title>Ibovespa sobe no encerramento de hoje (InfoMoney)</title><link>https://example.com/bolsa</link><pubDate>'+new Date().toUTCString()+'</pubDate></item></channel></rss>';
          const rows=lib.mkRssXml(xml,'InfoMoney');
          assert.equal(rows.length,1);
          assert.equal(rows[0].t,'Ibovespa sobe no encerramento de hoje');
          console.log('Serviço Notícias: título, deduplicação, cripto, datas e RSS aprovados.');
          NODE
      - name: Incrementar versão v643
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='release.config.json',cfg=JSON.parse(fs.readFileSync(p,'utf8'));
          if(cfg.version!==642)throw Error('Versão inesperada '+cfg.version);
          cfg.version=643;
          fs.writeFileSync(p,JSON.stringify(cfg,null,2)+'\n');
          NODE
      - run: npm run bundle
      - run: npm run build:check
      - name: Commit apenas arquivos de versão e bundles gerados
        run: |
          git config user.name "Diário Trader Bundle Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git diff --cached --name-only
          git diff --cached --quiet && exit 1
          git commit -m "v643: atualizar versão e bundles para fontes ampliadas de Notícias"
          git push origin HEAD:ai-news-v643
