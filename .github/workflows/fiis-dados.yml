name: Atualizar FIIs públicos (B3)

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fiis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Coletar e pontuar FIIs da B3
        run: node scripts/atualizar-fiis.mjs
      - name: Publicar dados-publicos/fiis.json se mudou
        run: |
          if [ -n "$(git status --porcelain dados-publicos/fiis.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados-publicos/fiis.json
            git commit -m "dados: atualiza FIIs públicos (B3)"
            git push
          fi
