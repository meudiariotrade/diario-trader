name: Deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy-diario-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar navegador dos testes
        timeout-minutes: 10
        run: |
          diario_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$diario_browser" ]; then
            "$diario_browser" --version
            printf 'CHROMIUM_PATH=%s\n' "$diario_browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Conferir sintaxe dos testes antes do build e testes longos
        run: |
          find tests -name '*.test.cjs' -print0 | xargs -0 -n1 node --check
          find . -maxdepth 1 -name 'test-*.cjs' -print0 | xargs -0 -r -n1 node --check
      - name: Conferir versão (impede publicar pacote antigo)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/check-versao.cjs
      - run: npm run build
      - run: npm run verify
      - name: Capturas de validação de Análises
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analises-v581-validacao
          path: test-results/analises-v581-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  # Worker v762 publicado diretamente via Cloudflare; o deploy do PWA
  # depende de OHLCV real e não de secrets ausentes no GitHub.
  verify-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirmar Cloudflare em produção (BTC, B3 e EUA)
        run: node scripts/verify-tecnico-edge.cjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate, verify-edge]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Gate Cloudflare antes do Pages (v762+)
        run: |
          versao="$(node -p 'require("./release.config.json").version')"
          if [ "$versao" -ge 762 ]; then
            echo "Conferindo candles públicos antes de publicar o PWA v$versao"
            node scripts/verify-tecnico-edge.cjs
          fi
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar arquivos no site público
        run: node scripts/verify-published.cjs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Diagnosticar cache público do Worker (sem bloquear o app)
        continue-on-error: true
        run: node scripts/diagnostico-screeners-cloudflare.mjs
