name: Deploy Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy-diario-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        timeout-minutes: 5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar navegador dos testes
        timeout-minutes: 10
        run: |
          diario_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$diario_browser" ]; then
            "$diario_browser" --version
            printf 'CHROMIUM_PATH=%s\n' "$diario_browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Conferir sintaxe dos testes antes do build e testes longos
        run: |
          find tests -name '*.test.cjs' -print0 | xargs -0 -n1 node --check
          find . -maxdepth 1 -name 'test-*.cjs' -print0 | xargs -0 -r -n1 node --check
      - name: Conferir versão (impede publicar pacote antigo)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          node scripts/check-versao.cjs
      - name: Testar ponte Profit e consulta sob demanda
        run: node --test tests/ponte-profit-v945.test.cjs
      - name: Testar preços Profit e Research v946
        run: node --test tests/profit-research-v946.test.cjs
      - name: Testar isolamento do canal Profit na Cloudflare
        run: node --test tests/profit-edge-v947.test.cjs
      - name: Testar perfil, busca e proteção de armazenamento v949
        run: node --test tests/perfil-busca-quota-v949.test.cjs
      - name: Testar Radar Proativo sem polling
        run: node --test tests/radar-proativo-v944.test.cjs
      - name: Validar corte do scanner legado
        run: node --test tests/cutover-screeners-v1001.test.cjs
      - run: npm run build
      # Build e validação estrutural continuam obrigatórios para publicar.
      - run: npm run check
      - name: Testar clique real da lupa e atalho de busca v950
        run: node --test tests/busca-global-mobile-v950.test.cjs tests/rebalanceamento-mobile-v951.test.cjs tests/research-v952.test.cjs
      - name: Regressões v956 — Áurea, ADRs e Mistral
        run: node --test tests/mistral-panorama-v956.test.cjs tests/v904-aurea-panorama.test.cjs
      - name: Áurea v1004 — imagens, privacidade e compositor mobile
        run: node --test tests/aurea-imagem-v1004.test.cjs tests/aurea-chat-mobile-v1004.test.cjs tests/aurea-multigraficos-v1011.test.cjs tests/aurea-pivos-v1012.test.cjs tests/aurea-debate-v1013.test.cjs
      - name: Regressões v955 — busca, cabeçalho e chat
        run: node --test tests/chat-busca-v955.test.cjs tests/integracao-cinco-frentes-v736.test.cjs
      - name: Regressões de qualidade v953 (egress, cabeçalho, Profit e Research)
        run: node --test --test-concurrency=1 tests/egress-v706.test.cjs tests/interface.test.cjs tests/ponte-cotacoes-v552.test.cjs tests/profit-cotacoes-v552.test.cjs tests/v852-noticias-ficha.test.cjs tests/v853-confiavel.test.cjs tests/quality-v953.test.cjs
      - name: Testes obrigatórios de Mercado e Egress
        run: node --test --test-concurrency=1 tests/mercado-simples-v549.test.cjs tests/auditar-egress-v938.test.cjs
      - name: Capturas de validação de Análises e Início/Meu Dia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-validacao-v810
          path: |
            test-results/analises-v581-*.png
            test-results/v810-*.png
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  # Worker v762 publicado diretamente via Cloudflare; o deploy do PWA
  # depende de OHLCV real e não de secrets ausentes no GitHub.
  # Testes extensos rodam em paralelo e não atrasam a entrega do PWA.
  # Resultado visível independentemente do deploy; build/check permanecem obrigatórios.
  quality:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar bundles para testes integrados
        run: npm run build
      - name: Testes integrados (paralelos à publicação)
        run: npm test
  verify-edge:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # A indisponibilidade temporária dos provedores de candles não pode impedir
      # a atualização dos arquivos estáticos do aplicativo.
      - name: Confirmar Cloudflare em produção (BTC, B3 e EUA)
        continue-on-error: true
        run: node scripts/verify-tecnico-edge.cjs
  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate]
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnóstico Cloudflare antes do Pages (sem bloquear publicação)
        continue-on-error: true
        run: |
          versao="$(node -p 'require("./release.config.json").version')"
          if [ "$versao" -ge 762 ]; then
            echo "Conferindo candles públicos antes de publicar o PWA v$versao"
            node scripts/verify-tecnico-edge.cjs
          fi
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar arquivos no site público
        run: node scripts/verify-published.cjs
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
      - name: Diagnosticar cache público do Worker (sem bloquear o app)
        continue-on-error: true
        run: node scripts/diagnostico-screeners-cloudflare.mjs

  sync-bundles:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run check
      - name: Persistir bundles regenerados depois dos testes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "build: sincroniza bundles e manifestos da v891"
            git push origin HEAD:main
          fi
