name: Preparar bundles de Noticias v646 (temporario)
on:
  push:
    branches: [news-v646-sync]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run bundle
      - run: node --test tests/noticias-v646.test.cjs
      - run: npm run build:check
      - name: Commitar bundles e remover workflow temporario
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/noticias-v646-sync.yml
          git add -A
          git commit -m 'Notícias: gerar bundles e sincronizar versão v646 (somente arquivos de publicação)'
          git push origin HEAD:news-v646-sync
