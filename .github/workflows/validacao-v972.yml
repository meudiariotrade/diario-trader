name: Validacao especifica v972
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm run check
      - run: node --test tests/jornal-classico-v729.test.cjs tests/jornal-subabas.test.cjs tests/build.test.cjs tests/publicacao.test.cjs
