name: Cloudflare Multi-IA e estudos v932
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/diario-screeners/**'
      - 'tests/cloudflare-ia-v932.test.cjs'
      - 'tests/cloudflare-extras-v936.test.cjs'
      - 'tests/cloudflare-central-v939.test.cjs'
      - 'tests/cloudflare-agenda-health-v937.test.cjs'
      - '.github/workflows/cloudflare-ia-v932.yml'
  pull_request:
    paths:
      - 'cloudflare/diario-screeners/**'
      - 'tests/cloudflare-ia-v932.test.cjs'
      - '.github/workflows/cloudflare-ia-v932.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-ia-v932
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/diario-screeners/index.mjs
      - run: node --test tests/aurea-imagem-v1004.test.cjs tests/aurea-multigraficos-v1011.test.cjs tests/aurea-pivos-v1012.test.cjs tests/aurea-debate-v1013.test.cjs
      - run: node --check cloudflare/diario-screeners/aurea-resumao-v904.mjs
      - run: node --test tests/v904-aurea-panorama.test.cjs tests/mistral-panorama-v956.test.cjs
      - run: node --test tests/profit-edge-v947.test.cjs
      - run: node --check cloudflare/diario-screeners/estatisticas-v932.mjs
      - run: node --check cloudflare/diario-screeners/explica-v932.mjs
      - run: node --check cloudflare/diario-screeners/estudos-v932.mjs
      - run: node --check cloudflare/diario-screeners/diario-ia-v933.mjs
      - run: node --check cloudflare/diario-screeners/extras-v936.mjs
      - run: node --check cloudflare/diario-screeners/central-v939.mjs
      - run: node --test tests/cloudflare-ia-v932.test.cjs tests/cloudflare-diario-ia-v933.test.cjs tests/cloudflare-extras-v936.test.cjs tests/cloudflare-central-v939.test.cjs tests/aurea-jwks.test.cjs tests/cloudflare-agenda-health-v937.test.cjs
  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-workers
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validar secrets sem revelar valores
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN"
          test -n "$CF_ACCOUNT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diario-screeners
          wranglerVersion: '4.166.0'
          command: deploy --config wrangler.jsonc
