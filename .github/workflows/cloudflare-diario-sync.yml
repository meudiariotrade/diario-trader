name: Cloudflare D1 - espelho seguro do Diario
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/diario-sync/**'
      - 'tests/cloudflare-diario-sync-v900.test.cjs'
      - 'tests/cloudflare-diario-sync-v906.test.cjs'
      - 'tests/cloudflare-diario-sync-v907.test.cjs'
      - 'tests/cloudflare-diario-sync-v913.test.cjs'
      - 'tests/cloudflare-diario-sync-v931.test.cjs'
      - 'tests/cloudflare-diario-sync-v942.test.cjs'
      - 'supabase/migrations/20261124010000_push_subs_leitura_propria_v942.sql'
      - '.github/workflows/cloudflare-diario-sync.yml'
  pull_request:
    paths:
      - 'cloudflare/diario-sync/**'
      - 'tests/cloudflare-diario-sync-v900.test.cjs'
      - 'tests/cloudflare-diario-sync-v906.test.cjs'
      - 'tests/cloudflare-diario-sync-v907.test.cjs'
      - 'tests/cloudflare-diario-sync-v913.test.cjs'
      - 'tests/cloudflare-diario-sync-v931.test.cjs'
      - 'tests/cloudflare-diario-sync-v942.test.cjs'
      - 'supabase/migrations/20261124010000_push_subs_leitura_propria_v942.sql'
      - '.github/workflows/cloudflare-diario-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-diario-sync
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check cloudflare/diario-sync/index.mjs
      - run: node --test tests/cloudflare-diario-sync-v900.test.cjs tests/cloudflare-diario-sync-v906.test.cjs tests/cloudflare-diario-sync-v907.test.cjs tests/cloudflare-diario-sync-v913.test.cjs tests/cloudflare-diario-sync-v931.test.cjs tests/cloudflare-diario-sync-v942.test.cjs
  publish:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-workers
    steps:
      - uses: actions/checkout@v4
      - name: Verificar credenciais
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/diario-sync
          wranglerVersion: '4.166.0'
          command: deploy --config wrangler.jsonc
