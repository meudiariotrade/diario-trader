name: Validacao integral v977
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preparar navegador
        run: |
          diario_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$diario_browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$diario_browser" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run build && npm run check
      - run: node --test test-gp-real.cjs tests/estudos-interface.test.cjs
      - run: npm test
