name: Gerar bundles (temporário)
on:
  push:
    branches: [bundles-v611]
permissions:
  contents: write
jobs:
  bundles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run bundle
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "bundles v611 [bundles]" || echo "nada a gerar"
          git push
