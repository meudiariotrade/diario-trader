name: Acionar deploy oficial do GitHub Pages v881
on:
  push:
    branches: [ci-v881-20261122]
permissions:
  actions: write
  contents: read
jobs:
  dispatch-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verificar que a main contem v881 aprovada
        env:
          EXPECTED_SHA: 680e6f500054c07cbfc0125e4631a8c78373c1c2
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node -p 'require("./release.config.json").version')" = "881"
      - name: Executar workflow oficial Deploy Pages na branch main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Deploy oficial de v881 solicitado."
