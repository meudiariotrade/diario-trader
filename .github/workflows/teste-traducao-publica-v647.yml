name: Diagnóstico temporário de tradução pública (CORS)
on:
  push:
    branches: ['fix/noticias-traducao-v647']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir CORS e provedores gratuitos
        run: |
          node <<'NODE'
          (async()=>{
            const q=encodeURIComponent("Markets rise after Fed decision");
            const endpoints=[
              ["Google","https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=pt&dt=t&q="+q],
              ["Clients5","https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=pt&q="+q],
              ["MyMemory","https://api.mymemory.translated.net/get?q="+q+"&langpair=en%7Cpt-BR"]
            ];
            const out=await Promise.all(endpoints.map(async([name,url])=>{
              try{
                const r=await fetch(url,{headers:{Origin:"https://meudiariotrade.github.io"},signal:AbortSignal.timeout(7500)});
                const body=await r.text();
                return{name,status:r.status,cors:r.headers.get("access-control-allow-origin"),type:r.headers.get("content-type"),sample:body.slice(0,230)};
              }catch(e){return{name,error:String(e.message||e)}}
            }));
            out.forEach(x=>console.log(JSON.stringify(x)));
          })();
          NODE
